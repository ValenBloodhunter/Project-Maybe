<!DOCTYPE html>
<html lang="en">

    <main class="app">

        <section class="screen active" id="landingScreen">

                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <p>project-maybe.exe</p>

                </div>


                <!-- Main content -->
                <div class="window-content">

                    <p class="terminal-label">
                        C:\projects\maybe&gt;

                    <h1>
